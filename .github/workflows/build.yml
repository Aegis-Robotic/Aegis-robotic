name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'             # fonctionne maintenant avec le lockfile

      - name: Install dependencies
        run: npm ci                # utilise ci (plus strict que install)

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
